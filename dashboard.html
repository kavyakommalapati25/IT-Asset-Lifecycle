<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssetNexa | Dashboard</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #087f8c;
  --green: #18a779;
  --text: #183451;
  --muted: #64748b;
  --bg: #f3f7fb;
  --border: #e2eaf1;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.topbar {
  min-height: 78px;
  padding: 15px 28px;
  background: linear-gradient(110deg, #087f8c, #20a879);
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  font-size: 36px;
  font-weight: bold;
}

.brand h2 {
  font-size: 22px;
}

.brand h2 span {
  color: #c7fff0;
}

.brand p {
  font-size: 10px;
  margin-top: 4px;
  opacity: .85;
}

.system-title {
  font-size: 15px;
  font-weight: 600;
  text-align: center;
}

.profile {
  text-align: right;
  font-size: 13px;
}

.profile small {
  display: block;
  margin-bottom: 4px;
}

.layout {
  display: flex;
  min-height: calc(100vh - 78px);
}

.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: white;
  border-right: 1px solid var(--border);
  padding: 22px 12px;
  display: flex;
  flex-direction: column;
}

.nav-label {
  color: #94a3b8;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;
  padding: 8px 12px;
}

.nav-link {
  display: flex;
  gap: 13px;
  align-items: center;
  padding: 13px 12px;
  margin: 3px 0;
  border-radius: 9px;
  text-decoration: none;
  color: #344b62;
  font-size: 13px;
  font-weight: 600;
  border: none;
  background: transparent;
  cursor: pointer;
  text-align: left;
  width: 100%;
}

.nav-link:hover,
.nav-link.active {
  color: var(--primary);
  background: #e1f6f3;
}

.nav-icon {
  width: 23px;
  font-size: 18px;
  text-align: center;
}

.logout-link {
  margin-top: auto;
}

.main {
  flex: 1;
  min-width: 0;
  padding: 28px;
}

.welcome {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  margin-bottom: 25px;
}

.eyebrow {
  color: var(--primary);
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1.4px;
  margin-bottom: 8px;
}

.welcome h1 {
  font-size: 29px;
  margin-bottom: 7px;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
}

.date-box {
  padding: 12px 15px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
  font-size: 12px;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 23px 0 14px;
}

.section-heading h2 {
  font-size: 17px;
}

.section-heading span {
  font-size: 11px;
  color: var(--muted);
}

/* GLOBAL SEARCH STYLES */
.global-search-panel {
  background: white;
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 20px;
  margin-bottom: 25px;
  box-shadow: 0 4px 16px rgba(25, 55, 85, .04);
}

.global-search-panel h2 {
  font-size: 18px;
  margin-bottom: 7px;
  color: var(--text);
}

.global-search-description {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  margin-bottom: 15px;
}

.global-search-input {
  width: 100%;
  padding: 13px 15px;
  border: 1px solid var(--border);
  border-radius: 9px;
  font-size: 14px;
  outline: none;
  color: var(--text);
  background: #fff;
}

.global-search-input:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(24, 167, 121, .10);
}

.global-search-status {
  font-size: 12px;
  color: var(--muted);
  margin-top: 12px;
  line-height: 1.6;
}

.global-search-results {
  margin-top: 12px;
  display: grid;
  gap: 9px;
}
