<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>IT ASSET LIFECYCLE, MAINTENANCE AND MANAGEMENT SYSTEM</title>
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff6ff, #e3f9e5);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(90deg, #0b8f9c, #39a96b);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            position: relative;
        }

        .logout {
            position: absolute;
            right: 25px;
            top: 17px;
            background: white;
            color: #087f8c;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .logout:hover {
            background: #e3f9e5;
            transform: translateY(-2px);
        }

        .welcome {
            padding: 30px 40px 10px;
        }

        .welcome h1 {
            margin-bottom: 5px;
            color: #087f8c;
        }

        .welcome p {
            color: #4f6f72;
            font-size: 16px;
        }

        .container {
            padding: 20px 40px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 6px 18px rgba(0, 120, 140, 0.15);
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #d5eeee;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(57, 169, 107, 0.25);
            border-color: #8bd5c0;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .card h2 {
            margin: 5px 0;
            color: #087f8c;
        }

        .card p {
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 800px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .logout {
                position: static;
                margin-top: 15px;
            }

            .header {
                padding-bottom: 15px;
            }

        }

    </style>

</head>


<body>

    <div class="header">

        <div class="title">
            IT ASSET LIFECYCLE, MAINTENANCE AND MANAGEMENT SYSTEM
        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>


    <div class="welcome">

        <h1>Dashboard</h1>

        <p>
            Welcome to the IT Asset Management System
        </p>

    </div>


    <div class="container">

        <div class="cards">

            <div class="card" onclick="openModule('Employee')">

                <div class="icon">👤</div>

                <h2>Employee</h2>

                <p>
                    Employee Registration
                </p>

            </div>


            <div class="card" onclick="openModule('Asset')">

                <div class="icon">💻</div>

                <h2>Asset</h2>

                <p>
                    Asset Registration
                </p>

            </div>


            <div class="card" onclick="openModule('Maintenance')">

                <div class="icon">🔧</div>

                <h2>Maintenance</h2>

                <p>
                    Asset Maintenance
                </p>

            </div>


            <div class="card" onclick="openModule('EMI')">

                <div class="icon">💰</div>

                <h2>EMI</h2>

                <p>
                    EMI Management
                </p>

            </div>


            <div class="card" onclick="openModule('Disposal')">

                <div class="icon">♻️</div>

                <h2>Disposal</h2>

                <p>
                    Asset Disposal
                </p>

            </div>


            <div class="card" onclick="openModule('Reports')">

                <div class="icon">📊</div>

                <h2>Reports</h2>

                <p>
                    View Asset Reports
                </p>

            </div>

        </div>

    </div>


    <script>

        /* ==============================
           LOGIN SESSION CHECK
        ============================== */

        if (sessionStorage.getItem("loggedIn") !== "true") {

            window.location.href = "index.html";

        }


        /* ==============================
           MODULE NAVIGATION
        ============================== */
        function openModule(moduleName) {

            if (moduleName === "Employee") {

                window.location.href = "employee.html";

            }

            else if (moduleName === "Asset") {

                window.location.href = "asset.html";

            }

            else if (moduleName === "Maintenance") {

                window.location.href = "maintenance.html";

            }

            else if (moduleName === "EMI") {

                window.location.href = "emi.html";

            }

            else if (moduleName === "Disposal") {

                window.location.href = "disposal.html";

            }

            else if (moduleName === "Reports") {
                window.location.href = "reports.html";
            }

        }
        /* ==============================
           LOGOUT
        ============================== */

        function logout() {
            sessionStorage.removeItem("loggedIn");
            window.location.href = "index.html";
        }

    </script>

</body>

</html>s
