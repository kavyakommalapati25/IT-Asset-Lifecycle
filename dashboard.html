<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssetNexa | Dashboard</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #087f8c;
  --green: #18a779;
  --text: #183451;
  --muted: #64748b;
  --bg: #f3f7fb;
  --border: #e2eaf1;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.topbar {
  min-height: 78px;
  padding: 15px 28px;
  background: linear-gradient(110deg, #087f8c, #20a879);
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  font-size: 36px;
  font-weight: bold;
}

.brand h2 {
  font-size: 22px;
}

.brand h2 span {
  color: #c7fff0;
}

.brand p {
  font-size: 10px;
  margin-top: 4px;
  opacity: .85;
}

.system-title {
  font-size: 15px;
  font-weight: 600;
  text-align: center;
}

/* PROFILE BUTTON */
.profile-button {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 12px;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 10px;
  background: rgba(255,255,255,.13);
  color: white;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}

.profile-button:hover {
  background: rgba(255,255,255,.25);
}

.profile-avatar {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: white;
  color: var(--primary);
  display: grid;
  place-items: center;
  overflow: hidden;
  font-size: 16px;
  font-weight: bold;
}

.profile-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.layout {
  display: flex;
  min-height: calc(100vh - 78px);
}

.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: white;
  border-right: 1px solid var(--border);
  padding: 22px 12px;
  display: flex;
  flex-direction: column;
}

.nav-label {
  color: #94a3b8;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;
  padding: 8px 12px;
}

.nav-link {
  display: flex;
  gap: 13px;
  align-items: center;
  padding: 13px 12px;
  margin: 3px 0;
  border-radius: 9px;
  text-decoration: none;
  color: #344b62;
  font-size: 13px;
  font-weight: 600;
  border: none;
  background: transparent;
  cursor: pointer;
  text-align: left;
  width: 100%;
}

.nav-link:hover,
.nav-link.active {
  color: var(--primary);
  background: #e1f6f3;
}

.nav-icon {
  width: 23px;
  font-size: 18px;
  text-align: center;
}

.logout-link {
  margin-top: auto;
}

.main {
  flex: 1;
  min-width: 0;
  padding: 28px;
}

.welcome {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  margin-bottom: 25px;
}

.eyebrow {
  color: var(--primary);
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1.4px;
  margin-bottom: 8px;
}

.welcome h1 {
  font-size: 29px;
  margin-bottom: 7px;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
}

.date-box {
  padding: 12px 15px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
  font-size: 12px;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 23px 0 14px;
}

.section-heading h2 {
  font-size: 17px;
}

.section-heading span {
  font-size: 11px;
  color: var(--muted);
}

.stats {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 13px;
}

.stat-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 15px;
  box-shadow: 0 4px 16px rgba(25, 55, 85, .04);
}

.stat-icon {
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  font-size: 20px;
  margin-bottom: 13px;
}

.blue { background: #e3f1ff; }
.green { background: #dcf8ec; }
.orange { background: #fff0d9; }
.purple { background: #eee8ff; }
.mint { background: #dff8f0; }
.sky { background: #e2f2ff; }

.stat-card h3 {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.5;
  min-height: 32px;
}

.stat-card strong {
  display: block;
  font-size: 27px;
  margin-top: 4px;
}

.stat-card small {
  display: block;
  color: #8795a5;
  font-size: 10px;
  margin-top: 6px;
}

.charts {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 15px;
}

.panel {
  background: white;
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 18px;
  min-width: 0;
  box-shadow: 0 4px 16px rgba(25, 55, 85, .04);
}

.panel h3 {
  font-size: 14px;
  margin-bottom: 5px;
}

.panel-subtitle {
  color: var(--muted);
  font-size: 10px;
  margin-bottom: 18px;
}

.donut-area {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  min-height: 165px;
}

.donut {
  width: 135px;
  height: 135px;
  flex-shrink: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
}

.asset-donut {
  background: conic-gradient(
    #3986e8 0 72%,
    #35c48c 72% 88%,
    #ffbd3d 88% 100%
  );
}

.category-donut {
  background: conic-gradient(
    #3986e8 0 48%,
    #35c48c 48% 72%,
    #ffbd3d 72% 88%,
    #8b65e8 88% 100%
  );
}

.donut::before {
  content: "";
  position: absolute;
  inset: 25px;
  border-radius: 50%;
  background: white;
}

.donut-center {
  z-index: 1;
  text-align: center;
}

.donut-center strong {
  display: block;
  font-size: 23px;
}

.donut-center span {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 3px;
}

.legend {
  list-style: none;
  flex: 1;
  min-width: 0;
}

.legend li {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 13px 0;
  font-size: 10px;
  color: #52677c;
}

.legend b {
  margin-left: auto;
  color: var(--text);
  font-size: 11px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

.bar-chart {
  height: 175px;
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  background: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 42px,
    #edf2f6 43px,
    transparent 44px
  );
}

.bar-column {
  height: 100%;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  gap: 7px;
}

.bar-value {
  font-size: 11px;
  font-weight: bold;
}

.bar {
  width: 65%;
  max-width: 38px;
  min-height: 5px;
  border-radius: 5px 5px 0 0;
}

.bar-label {
  height: 30px;
  text-align: center;
  font-size: 9px;
  color: var(--muted);
}

.bottom-grid {
  display: grid;
  grid-template-columns: 1.7fr 1fr;
  gap: 15px;
  margin-top: 15px;
}

.activity-header {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 17px;
}

.activity-header h3 {
  margin-bottom: 5px;
}

.search {
  width: 180px;
  max-width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: none;
}

.search:focus {
  border-color: var(--green);
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  white-space: nowrap;
}

th {
  background: #f1f6fa;
  padding: 12px 10px;
  font-size: 10px;
}

td {
  padding: 12px 10px;
  border-bottom: 1px solid #edf2f6;
  font-size: 10px;
  color: #52677c;
}

.module-chip {
  background: #edf5ff;
  color: #3677b8;
  padding: 5px 7px;
  border-radius: 6px;
  font-size: 9px;
}

.status {
  padding: 5px 8px;
  border-radius: 20px;
  font-size: 9px;
  font-weight: bold;
}

.completed {
  background: #d9f7e8;
  color: #11794f;
}

.in-progress {
  background: #fff0d0;
  color: #a66a08;
}

.banner {
  min-height: 250px;
  border: 1px solid #ccece5;
  border-radius: 13px;
  padding: 24px;
  background: linear-gradient(135deg, #e6faf5, #effaff);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.banner-icon {
  font-size: 34px;
  margin-bottom: 16px;
}

.banner h3 {
  font-size: 22px;
  line-height: 1.35;
  color: var(--primary);
  margin-bottom: 12px;
}

.banner p {
  font-size: 12px;
  line-height: 1.7;
  color: #526b7e;
}

.banner button {
  align-self: flex-start;
  margin-top: 17px;
  padding: 10px 13px;
  color: white;
  background: var(--primary);
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.footer {
  text-align: center;
  color: #94a3b8;
  font-size: 10px;
  padding: 23px 0 5px;
}

/* PROFILE WINDOW - ADDED FEATURE ONLY */
.profile-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(15, 35, 50, .55);
  padding: 20px;
  align-items: center;
  justify-content: center;
}

.profile-modal.show {
  display: flex;
}

.profile-box {
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  background: white;
  border-radius: 16px;
  padding: 25px;
  box-shadow: 0 15px 50px rgba(0,0,0,.2);
}

.profile-box-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.profile-box-header h2 {
  font-size: 21px;
  color: var(--text);
}

.close-profile {
  border: none;
  background: #f1f5f9;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  font-size: 22px;
  cursor: pointer;
}

.photo-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
}

.large-avatar {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  background: #e1f6f3;
  color: var(--primary);
  display: grid;
  place-items: center;
  font-size: 36px;
  font-weight: bold;
  overflow: hidden;
  border: 3px solid #d0eee8;
}

.large-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-label {
  color: var(--primary);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.photo-label input {
  display: none;
}

.profile-field {
  margin-bottom: 15px;
}

.profile-field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 7px;
  color: #344b62;
}

.profile-field input {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  font-size: 13px;
  outline: none;
}

.profile-field input:focus {
  border-color: var(--green);
}

.profile-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 22px;
}

.profile-actions button {
  padding: 11px 17px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}

.cancel-profile {
  background: #edf2f7;
  color: #344b62;
}

.save-profile {
  background: var(--primary);
  color: white;
}

.profile-message {
  display: none;
  padding: 10px;
  margin-top: 12px;
  border-radius: 8px;
  font-size: 12px;
  background: #dcf8ec;
  color: #11794f;
}

@media (max-width: 1250px) {
  .stats {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .charts {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .charts .panel:last-child {
    grid-column: 1 / -1;
  }
}

@media (max-width: 900px) {
  .system-title {
    display: none;
  }

  .sidebar {
    width: 72px;
    padding: 15px 7px;
  }

  .nav-label,
  .nav-text {
    display: none;
  }

  .nav-link {
    justify-content: center;
    padding: 13px 5px;
  }

  .main {
    padding: 20px;
  }

  .bottom-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 600px) {
  .topbar {
    padding: 13px;
  }

  .brand h2 {
    font-size: 17px;
  }

  .brand p {
    display: none;
  }

  .profile-button {
    padding: 6px;
    font-size: 11px;
  }

  .profile-button .profile-button-text {
    display: none;
  }

  .sidebar {
    width: 55px;
    padding: 10px 4px;
  }

  .main {
    padding: 15px 10px;
  }

  .welcome h1 {
    font-size: 25px;
  }

  .stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }

  .stat-card {
    padding: 12px;
  }

  .stat-card strong {
    font-size: 23px;
  }

  .charts {
    grid-template-columns: 1fr;
  }

  .charts .panel:last-child {
    grid-column: auto;
  }

  .panel {
    padding: 13px;
  }

  .donut {
    width: 115px;
    height: 115px;
  }

  .donut::before {
    inset: 22px;
  }

  .legend li {
    font-size: 9px;
  }

  .section-heading span {
    display: none;
  }

  .profile-box {
    padding: 18px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">A</div>
    <div>
      <h2>Asset<span>Nexa</span></h2>
      <p>IT ASSET LIFECYCLE MANAGEMENT</p>
    </div>
  </div>

  <div class="system-title">
    IT Asset Lifecycle, Maintenance and Management System
  </div>

  <!-- PROFILE BUTTON ADDED -->
  <button class="profile-button" type="button" onclick="openProfile()">
    <span class="profile-avatar" id="topProfileAvatar">👤</span>
    <span class="profile-button-text" id="topProfileName">My Profile</span>
  </button>
</header>

<!-- PROFILE WINDOW ADDED -->
<div class="profile-modal" id="profileModal" onclick="closeProfileOutside(event)">
  <div
