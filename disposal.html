
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disposal - IT Asset Lifecycle</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff6ff, #e3f9e5);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(90deg, #0b8f9c, #39a96b);
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1250px;
            margin: 35px auto;
        }

        .form-box, .report-box {
            background: rgba(255, 255, 255, 0.96);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 120, 140, 0.18);
            margin-bottom: 30px;
        }

        h1, h2 {
            color: #087f8c;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            color: #087f8c;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #b7dfe2;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        input:focus, select:focus {
            outline: 2px solid #39a96b;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 12px 24px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn {
            background: linear-gradient(90deg, #0b8f9c, #39a96b);
            color: white;
        }

        .clear-btn, .back-btn, .search-btn {
            background: #e8f4f4;
            color: #087f8c;
            border: 1px solid #b7dfe2;
        }

        button:hover {
            opacity: 0.85;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .search-box {
            display: grid;
            grid-template-columns: 200px 1fr auto auto;
            gap: 12px;
            margin: 20px 0;
            align-items: center;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: linear-gradient(90deg, #0b8f9c, #39a96b);
            color: white;
            padding: 12px;
            white-space: nowrap;
        }

        td {
            padding: 11px;
            text-align: center;
            border-bottom: 1px solid #d5eeee;
        }

        tbody tr:nth-child(even) {
            background: #f1fbf8;
        }

        tbody tr:hover {
            background: #e3f9e5;
        }

        .no-results {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        @media (max-width: 800px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .search-box {
                grid-template-columns: 1fr;
            }

            .container {
                width: 95%;
            }

            .form-box, .report-box {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        IT Asset Lifecycle &amp; Maintenance
    </div>

    <div class="container">

        <!-- DISPOSAL REGISTRATION -->
        <div class="form-box">
            <h1>Disposal Registration</h1>

            <form id="disposalForm">
                <div class="form-grid">

                    <div class="form-group">
                        <label for="employee_id">Employee ID</label>
                        <input type="text" id="employee_id"
                               placeholder="Enter Employee ID" required>
                    </div>

                    <div class="form-group">
                        <label for="asset_id">Asset ID</label>
                        <input type="text" id="asset_id"
                               placeholder="Enter Asset ID" required>
                    </div>

                    <div class="form-group">
                        <label for="disposal_date">Disposal Date</label>
                        <input type="text" id="disposal_date"
                               placeholder="DD.MM.YYYY"
                               pattern="[0-9]{2}\.[0-9]{2}\.[0-9]{4}"
                               title="Enter date as DD.MM.YYYY" required>
                    </div>

                    <div class="form-group">
                        <label for="disposal_type">Disposal Type</label>
                        <select id="disposal_type" required>
                            <option value="">Select Disposal Type</option>
                            <option value="SOLD">SOLD</option>
                            <option value="DONATED">DONATED</option>
                            <option value="SCRAPPED">SCRAPPED</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="disposal_status">Disposal Status</label>
                        <select id="disposal_status" required>
                            <option value="">Select Status</option>
                            <option value="COMPLETED">COMPLETED</option>
                            <option value="DISPOSED">DISPOSED</option>
                        </select>
                    </div>

                </div>

                <div class="buttons">
                    <button type="submit" class="save-btn">
                        Register Disposal
                    </button>

                    <button type="reset" class="clear-btn">
                        Clear
                    </button>

                    <button type="button" class="back-btn"
                            onclick="goDashboard()">
                        Back to Dashboard
                    </button>
                </div>
            </form>

            <p id="message" class="message" role="status"></p>
        </div>

        <!-- DISPOSAL REPORT -->
        <div class="report-box">
            <h2>Disposal Report</h2>

            <!-- SEARCH BAR -->
            <div class="search-box">
                <select id="searchField" aria-label="Search field">
                    <option value="asset">Search by Asset ID</option>
                    <option value="employee">Search by Employee ID</option>
                </select>

                <input type="text" id="searchInput"
                       placeholder="Enter Asset ID to search">

                <button type="button" class="search-btn"
                        onclick="searchRecords()">
                    Search
                </button>

                <button type="button" class="clear-btn"
                        onclick="clearSearch()">
                    Clear Search
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Disposal ID</th>
                            <th>Employee ID</th>
                            <th>Asset ID</th>
                            <th>Disposal Date</th>
                            <th>Disposal Type</th>
                            <th>Disposal Status</th>
                        </tr>
                    </thead>

                    <tbody id="disposalTableBody"></tbody>
                </table>
            </div>

            <p id="searchMessage" class="message" role="status"></p>
        </div>

    </div>

    <script>
        if (sessionStorage.getItem("loggedIn") !== "true") {
            window.location.href = "index.html";
        }

        const STORAGE_KEY = "itAssetDisposalRecords";

        // Employee IDs for the existing records were not provided.
        // They are intentionally left blank rather than guessed.
        const initialRecords = [
            { id: 6001, employee: "", asset: "1001", date: "20.09.2026", type: "SOLD", status: "COMPLETED" },
            { id: 6002, employee: "", asset: "1002", date: "22.09.2026", type: "DONATED", status: "COMPLETED" },
            { id: 6003, employee: "", asset: "1003", date: "25.09.2026", type: "SCRAPPED", status: "COMPLETED" },
            { id: 6004, employee: "", asset: "1004", date: "28.09.2026", type: "SCRAPPED", status: "DISPOSED" },
            { id: 6005, employee: "", asset: "1005", date: "29.09.2026", type: "SOLD", status: "COMPLETED" },
            { id: 6006, employee: "", asset: "1006", date: "30.09.2026", type: "DONATED", status: "COMPLETED" },
            { id: 6007, employee: "", asset: "1007", date: "30.09.2026", type: "SCRAPPED", status: "DISPOSED" },
            { id: 6008, employee: "", asset: "1008", date: "01.10.2026", type: "SOLD", status: "COMPLETED" },
            { id: 6009, employee: "", asset: "1009", date: "02.10.2026", type: "DONATED", status: "COMPLETED" },
            { id: 6010, employee: "", asset: "1010", date: "02.10.2026", type: "SCRAPPED", status: "DISPOSED" }
        ];

        function loadRecords() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);

                if (saved !== null) {
                    const records = JSON.parse(saved);
                    return Array.isArray(records)
                        ? records.map(record => ({
                            ...record,
                            employee: record.employee || ""
                        }))
                        : [...initialRecords];
                }

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(initialRecords)
                );

                return [...initialRecords];
            } catch (error) {
                return [...initialRecords];
            }
        }

        let disposalRecords = loadRecords();

        function displayRecords(records = disposalRecords) {
            const tableBody =
                document.getElementById("disposalTableBody");

            tableBody.replaceChildren();

            if (records.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");

                cell.colSpan = 6;
                cell.className = "no-results";
                cell.textContent = "No matching disposal records found.";

                row.appendChild(cell);
                tableBody.appendChild(row);
                return;
            }

            records.forEach(record => {
                const row = document.createElement("tr");

                [
                    record.id,
                    record.employee || "—",
                    record.asset,
                    record.date,
                    record.type,
                    record.status
                ].forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                tableBody.appendChild(row);
            });
        }

        function searchRecords() {
            const searchField =
                document.getElementById("searchField").value;

            const searchValue =
                document.getElementById("searchInput")
                    .value.trim().toLowerCase();

            const searchMessage =
                document.getElementById("searchMessage");

            if (!searchValue) {
                displayRecords();
                searchMessage.style.color = "#087f8c";
                searchMessage.textContent =
                    "Enter an Employee ID or Asset ID to search.";
                return;
            }

            const filteredRecords = disposalRecords.filter(record => {
                const fieldValue = searchField === "employee"
                    ? record.employee
                    : record.asset;

                return String(fieldValue || "")
                    .toLowerCase()
                    .includes(searchValue);
            });

            displayRecords(filteredRecords);

            searchMessage.style.color = "#087f8c";
            searchMessage.textContent =
                filteredRecords.length + " matching record(s) found.";
        }

        function clearSearch() {
            document.getElementById("searchInput").value = "";
            document.getElementById("searchMessage").textContent = "";
            displayRecords();
        }

        document.getElementById("searchField")
            .addEventListener("change", function() {
                document.getElementById("searchInput").value = "";
                document.getElementById("searchInput").placeholder =
                    this.value === "employee"
                        ? "Enter Employee ID to search"
                        : "Enter Asset ID to search";

                document.getElementById("searchMessage").textContent = "";
                displayRecords();
            });

        document.getElementById("searchInput")
            .addEventListener("keydown", function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    searchRecords();
                }
            });

        document.getElementById("disposalForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                const employeeId =
                    document.getElementById("employee_id").value.trim();

                const assetId =
                    document.getElementById("asset_id").value.trim();

                const disposalDate =
                    document.getElementById("disposal_date").value.trim();

                const disposalType =
                    document.getElementById("disposal_type").value;

                const disposalStatus =
                    document.getElementById("disposal_status").value;

                const message = document.getElementById("message");

                const dateMatch = disposalDate.match(
                    /^(\d{2})\.(\d{2})\.(\d{4})$/
                );

                if (!dateMatch) {
                    message.style.color = "red";
                    message.textContent =
                        "Enter the date in DD.MM.YYYY format.";
                    return;
                }

                const day = Number(dateMatch[1]);
                const month = Number(dateMatch[2]);
                const year = Number(dateMatch[3]);
                const date = new Date(year, month - 1, day);

                if (
                    date.getFullYear() !== year ||
                    date.getMonth() !== month - 1 ||
                    date.getDate() !== day
                ) {
                    message.style.color = "red";
                    message.textContent = "Enter a valid date.";
                    return;
                }

                if (disposalRecords.some(record =>
                    record.asset === assetId
                )) {
                    message.style.color = "red";
                    message.textContent =
                        "A disposal record already exists for this Asset ID.";
                    return;
                }

                const nextId = disposalRecords.length
                    ? Math.max(...disposalRecords.map(record =>
                        Number(record.id) || 0
                    )) + 1
                    : 6001;

                const newRecord = {
                    id: nextId,
                    employee: employeeId,
                    asset: assetId,
                    date: disposalDate,
                    type: disposalType,
                    status: disposalStatus
                };

                disposalRecords.push(newRecord);

                try {
                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(disposalRecords)
                    );
                } catch (error) {
                    disposalRecords.pop();
                    message.style.color = "red";
                    message.textContent =
                        "Unable to save this record in browser storage.";
                    return;
                }

                displayRecords();
                clearSearch();

                message.style.color = "green";
                message.textContent =
                    "Disposal registered successfully! Disposal ID: " + nextId;

                this.reset();
            });

        document.getElementById("disposalForm")
            .addEventListener("reset", function() {
                document.getElementById("message").textContent = "";
            });

        function goDashboard() {
            window.location.href = "dashboard.html";
        }

        displayRecords();
    </script>

</body>
</html>
