<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMI - AssetNexa</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --navy: #243b64;
    --blue: #456b9a;
    --pale: #eef2f7;
    --line: #cbd5e1;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2f7, #e8edf5);
    min-height: 100vh;
    color: #172033;
}

.header {
    background: linear-gradient(90deg, var(--navy), var(--blue));
    color: white;
    padding: 18px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

.container {
    width: 95%;
    max-width: 1250px;
    margin: 32px auto;
}

.form-box,
.report-box,
.payments-box {
    background: rgba(255, 255, 255, 0.98);
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(36, 59, 100, 0.14);
    margin-bottom: 28px;
}

h1, h2 {
    color: var(--navy);
}

.form-box h1 {
    text-align: center;
    margin: 0 0 25px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 17px;
}

.form-group {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

label {
    margin-bottom: 7px;
    color: var(--navy);
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    background: white;
}

input:focus, select:focus {
    border-color: var(--blue);
    box-shadow: 0 0 5px #456b9a33;
}

.buttons {
    text-align: center;
    margin-top: 24px;
}

button {
    padding: 11px 18px;
    margin: 4px;
    border: 0;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-1px);
    opacity: 0.92;
}

.save-btn, .primary-btn {
    background: linear-gradient(90deg, var(--navy), var(--blue));
    color: white;
}

.clear-btn, .secondary-btn {
    background: #e8edf5;
    color: var(--navy);
    border: 1px solid var(--line);
}

.back-btn {
    background: white;
    color: var(--navy);
    border: 1px solid var(--line);
}

.small-btn {
    padding: 7px 10px;
    font-size: 12px;
    margin: 2px;
}

.message {
    text-align: center;
    margin: 14px 0 0;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.report-box, .payments-box {
    overflow-x: auto;
}

.report-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 14px;
}

.report-heading h2 {
    margin: 0;
}

.search-box {
    width: 360px;
    max-width: 100%;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 14px;
    min-width: 1000px;
}

th {
    background: linear-gradient(90deg, var(--navy), var(--blue));
    color: white;
    padding: 12px;
    text-align: center;
    white-space: nowrap;
}

td {
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid #dbe2ea;
    vertical-align: middle;
}

tbody tr:nth-child(even) {
    background: #f4f7fb;
}

tbody tr:hover {
    background: #e5edf8;
}

#noResults {
    display: none;
    text-align: center;
    color: #64748b;
    padding: 20px;
    font-weight: bold;
}

.hint {
    font-size: 13px;
    line-height: 1.5;
    color: #526174;
    margin-top: 12px;
}

.status-pill {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    background: #e4f5eb;
    color: #166534;
}

.status-inactive {
    background: #f1f5f9;
    color: #475569;
}

.action-cell {
    min-width: 190px;
}

/* RECEIPT PREVIEW */
.receipt-overlay {
    position: fixed;
    inset: 0;
    background: #0f172a99;
    z-index: 1000;
    display: none;
    align-items: flex-start;
    justify-content: center;
    overflow: auto;
    padding: 24px;
}

.receipt-panel {
    background: white;
    border-radius: 12px;
    width: 100%;
    max-width: 850px;
    padding: 18px;
    margin: auto;
    box-shadow: 0 15px 50px #0003;
}

.receipt-toolbar {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
}

.receipt-paper {
    border: 1px solid #d5dce7;
    padding: 30px;
    position: relative;
    min-height: 600px;
    color: #182235;
    background: #fff;
}

.receipt-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    border-bottom: 3px solid var(--navy);
    padding-bottom: 18px;
}

.company-name {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 0.4px;
    color: var(--navy);
}

.company-subtitle {
    font-size: 12px;
    color: #5b6474;
    margin-top: 5px;
}

/* DECORATIVE COMPANY STAMP */
.stamp {
    width: 112px;
    height: 112px;
    border: 3px double #315c8d;
    color: #315c8d;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: bold;
    transform: rotate(-10deg);
    flex-shrink: 0;
    line-height: 1.25;
    background: white;
}

.stamp-name {
    font-size: 13px;
    letter-spacing: 1px;
}

.stamp-text {
    font-size: 9px;
    margin-top: 4px;
    letter-spacing: 0.5px;
}

.receipt-title {
    text-align: center;
    color: var(--navy);
    font-size: 22px;
    font-weight: bold;
    margin: 24px 0 6px;
    text-transform: uppercase;
}

.receipt-status {
    text-align: center;
    color: #8a4b08;
    font-weight: bold;
    font-size: 12px;
    letter-spacing: 0.4px;
    margin-bottom: 22px;
}

.receipt-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 24px;
    background: #f4f7fb;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
}

.receipt-meta div {
    font-size: 13px;
    overflow-wrap: anywhere;
}

.receipt-meta strong {
    color: var(--navy);
}

.receipt-table {
    min-width: 0;
    margin: 0 0 20px;
}

.receipt-table th,
.receipt-table td {
    text-align: left;
    padding: 11px;
}

.total-row td {
    font-weight: bold;
    background: #f4f7fb;
}

.receipt-note {
    font-size: 12px;
    line-height: 1.5;
    color: #526174;
    margin-top: 18px;
    border-top: 1px solid #dbe2ea;
    padding-top: 12px;
}

/* SIGNATURE PLACEHOLDER */
.signature-area {
    display: flex;
    justify-content: flex-end;
    margin-top: 42px;
}

.signature-block {
    text-align: center;
    width: 220px;
    font-size: 12px;
    color: #334155;
}

.signature-line {
    border-top: 1px solid #334155;
    margin-bottom: 8px;
    height: 1px;
}

.signature-label {
    font-weight: bold;
    color: var(--navy);
    font-size: 13px;
}

    bottom: 15px;
    left: 30px;
