<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>Asset - IT Asset Lifecycle</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff6ff, #e3f9e5);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(90deg, #0b8f9c, #39a96b);
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .form-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 120, 140, 0.18);
            margin-bottom: 30px;
        }

        .form-box h1 {
            text-align: center;
            color: #087f8c;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 7px;
            color: #087f8c;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #b7dfe2;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #39a96b;
            box-shadow: 0 0 5px rgba(57, 169, 107, 0.25);
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .save-btn {
            background: linear-gradient(90deg, #0b8f9c, #39a96b);
            color: white;
        }

        .clear-btn {
            background: #e8f4f4;
            color: #087f8c;
            border: 1px solid #b7dfe2;
        }

        .back-btn {
            background: #ffffff;
            color: #087f8c;
            border: 1px solid #b7dfe2;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .save-btn:hover {
            background: linear-gradient(90deg, #087f8c, #2d8f5b);
        }

        .clear-btn:hover,
        .back-btn:hover {
            background: #e3f9e5;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .report-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 120, 140, 0.18);
            overflow-x: auto;
        }

        .report-box h2 {
            color: #087f8c;
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            min-width: 1000px;
        }

        th {
            background: linear-gradient(90deg, #0b8f9c, #39a96b);
            color: white;
            padding: 12px;
            text-align: center;
        }

        td {
            padding: 11px;
            text-align: center;
            border-bottom: 1px solid #d5eeee;
        }

        tr:nth-child(even) {
            background: #f1fbf8;
        }

        tr:hover {
            background: #e3f9e5;
        }

        @media (max-width: 900px) {

            .form-grid {
                grid-template-columns: 1fr 1fr;
            }

        }

        @media (max-width: 600px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                width: 95%;
            }

        }

    </style>

</head>


<body>

    <div class="header">
        IT Asset Lifecycle & Maintenance
    </div>


    <div class="container">


        <!-- ASSET FORM -->

        <div class="form-box">

            <h1>Asset Registration</h1>


            <div class="form-grid">


                <div class="form-group">

                    <label>Asset ID</label>

                    <input
                        type="text"
                        id="asset_id"
                        placeholder="Enter Asset ID">

                </div>


                <div class="form-group">

                    <label>Asset Name</label>

                    <input
                        type="text"
                        id="asset_name"
                        placeholder="Enter Asset Name">

                </div>


                <div class="form-group">

                    <label>Asset Type</label>

                    <input
                        type="text"
                        id="asset_type"
                        placeholder="Enter Asset Type">

                </div>


                <div class="form-group">

                    <label>Date</label>

                    <input
                        type="text"
                        id="asset_date"
                        placeholder="DD.MM.YYYY">

                </div>


                <div class="form-group">

                    <label>Cost</label>

                    <input
                        type="text"
                        id="cost"
                        placeholder="Enter Cost">

                </div>


                <div class="form-group">

                    <label>Warranty</label>

                    <input
                        type="text"
                        id="warranty"
                        placeholder="DD.MM.YYYY">

                </div>


                <div class="form-group">

                    <label>Status</label>

                    <select id="status">

                        <option value="">
                            Select Status
                        </option>

                        <option value="ACTIVE">
                            ACTIVE
                        </option>

                        <option value="INACTIVE">
                            INACTIVE
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Location</label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Enter Location">

                </div>


                <div class="form-group">

                    <label>Employee ID</label>

                    <input
                        type="text"
                        id="emp_id"
                        placeholder="Enter Employee ID">

                </div>


            </div>


            <div class="buttons">

                <button
                    class="save-btn"
                    onclick="saveAsset()">

                    Save Asset

                </button>


                <button
                    class="clear-btn"
                    onclick="clearForm()">

                    Clear

                </button>


                <button
                    class="back-btn"
                    onclick="goDashboard()">

                    Back to Dashboard

                </button>

            </div>


            <p
                id="message"
                class="message">
            </p>


        </div>



        <!-- ASSET REPORT -->

        <div class="report-box">

            <h2>Asset Report</h2>


            <table>

                <thead>

                    <tr>

                        <th>Asset ID</th>
                        <th>Asset Name</th>
                        <th>Asset Type</th>
                        <th>Date</th>
                        <th>Cost</th>
                        <th>Warranty</th>
                        <th>Status</th>
                        <th>Location</th>
                        <th>Employee ID</th>

                    </tr>

                </thead>


                <tbody>

                    <tr>

                        <td>ASS01</td>
                        <td>LAPTOP</td>
                        <td>IT EQUIPMENT</td>
                        <td>12.09.2026</td>
                        <td>50,000</td>
                        <td>28.09.2027</td>
                        <td>ACTIVE</td>
                        <td>OFFICE</td>
                        <td>1001</td>

                    </tr>

                </tbody>

            </table>

        </div>


    </div>


    <script>


        /* LOGIN SESSION CHECK */

        if (sessionStorage.getItem("loggedIn") !== "true") {

            window.location.href = "index.html";

        }



        /* SAVE ASSET */

        function saveAsset() {

            let assetId =
                document.getElementById("asset_id").value;

            let assetName =
                document.getElementById("asset_name").value;

            let assetType =
                document.getElementById("asset_type").value;

            let assetDate =
                document.getElementById("asset_date").value;

            let cost =
                document.getElementById("cost").value;

            let warranty =
                document.getElementById("warranty").value;

            let status =
                document.getElementById("status").value;

            let location =
                document.getElementById("location").value;

            let empId =
                document.getElementById("emp_id").value;

            let message =
                document.getElementById("message");


            if (
                assetId === "" ||
                assetName === "" ||
                assetType === "" ||
                assetDate === "" ||
                cost === "" ||
                warranty === "" ||
                status === "" ||
                location === "" ||
                empId === ""
            ) {

                message.style.color = "red";

                message.innerHTML =
                    "Please fill all the fields.";

                return;

            }


            message.style.color = "green";

            message.innerHTML =
                "Asset record saved successfully!";

        }



        /* CLEAR FORM */

        function clearForm() {

            document.getElementById("asset_id").value = "";

            document.getElementById("asset_name").value = "";

            document.getElementById("asset_type").value = "";

            document.getElementById("asset_date").value = "";

            document.getElementById("cost").value = "";

            document.getElementById("warranty").value = "";

            document.getElementById("status").value = "";

            document.getElementById("location").value = "";

            document.getElementById("emp_id").value = "";

            document.getElementById("message").innerHTML = "";

        }



        /* BACK TO DASHBOARD */

        function goDashboard() {

            window.location.href =
                "dashboard.html";

        }


    </script>


</body>

</html>
