
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - IT Asset Lifecycle</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff6ff, #e3f9e5);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(90deg, #0b8f9c, #39a96b);
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .register-box {
            width: 420px;
            max-width: calc(100% - 30px);
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.96);
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 120, 140, 0.18);
            text-align: center;
        }

        .register-box h1 {
            margin: 20px 0 28px;
            color: #087f8c;
            font-size: 36px;
        }

        input {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid #b7dfe2;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus {
            border-color: #39a96b;
            box-shadow: 0 0 5px rgba(57, 169, 107, 0.25);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: linear-gradient(90deg, #0b8f9c, #39a96b);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(90deg, #087f8c, #2d8f5b);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 16px;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.5;
        }

        .back-login {
            margin-top: 22px;
            font-size: 15px;
            color: #555;
        }

        .back-login a {
            color: #087f8c;
            font-weight: bold;
            text-decoration: none;
        }

        .back-login a:hover {
            color: #39a96b;
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .register-box {
                margin: 30px auto;
                padding: 24px;
            }

            .register-box h1 {
                font-size: 30px;
            }

            .header {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        IT Asset Lifecycle &amp; Maintenance
    </div>

    <div class="register-box">

        <h1>Create Account</h1>

        <form id="registerForm">

            <input
                type="text"
                id="fullname"
                placeholder="Full Name"
                autocomplete="name"
                required
            >

            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
                minlength="3"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password (minimum 6 characters)"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <button type="submit" id="registerButton">
                Register
            </button>

        </form>

        <p id="message" class="message" role="status" aria-live="polite"></p>

        <p class="back-login">
            Already registered?
            <a href="index.html">Login here</a>
        </p>

    </div>

    <script>
        const registerForm = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const registerButton = document.getElementById("registerButton");

        registerForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const fullname = document.getElementById("fullname").value.trim();
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            message.textContent = "";
            message.style.color = "red";

            if (!fullname || !username || !email || !password || !confirmPassword) {
                message.textContent = "Please fill in all fields.";
                return;
            }

            if (username.length < 3) {
                message.textContent = "Username must contain at least 3 characters.";
                return;
            }

            if (password.length < 6) {
                message.textContent = "Password must contain at least 6 characters.";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            try {
                const users = JSON.parse(
                    localStorage.getItem("assetUsers") || "[]"
                );

                if (!Array.isArray(users)) {
                    throw new Error("Invalid user data");
                }

                const usernameExists = users.some(user =>
                    user.username.toLowerCase() === username.toLowerCase()
                );

                if (username.toLowerCase() === "admin" || usernameExists) {
                    message.textContent =
                        "Username already exists. Please choose another.";
                    return;
                }

                const emailExists = users.some(user =>
                    user.email.toLowerCase() === email.toLowerCase()
                );

                if (emailExists) {
                    message.textContent =
                        "This email is already registered.";
                    return;
                }

                const newUser = {
                    fullname: fullname,
                    username: username,
                    email: email,
                    password: password
                };

                users.push(newUser);

                localStorage.setItem("assetUsers", JSON.stringify(users));

                message.style.color = "green";
                message.textContent =
                    "Registration successful! Redirecting to login...";

                registerButton.disabled = true;

                setTimeout(function() {
                    window.location.href = "index.html";
                }, 1500);

            } catch (error) {
                console.error("Registration error:", error);

                message.style.color = "red";
                message.textContent =
                    "Registration failed. Please try again.";
            } finally {
                // Button stays disabled briefly only after successful registration.
                if (message.style.color !== "green") {
                    registerButton.disabled = false;
                }
            }
        });
    </script>

</body>
</html>
