<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>IT ASSET LIFECYCLE, MAINTENANCE AND MANAGEMENT SYSTEM</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff6ff, #e3f9e5);
            min-height: 100vh;
        }

        .header {
            height: 65px;
            background: linear-gradient(90deg, #0b8f9c, #39a96b);
            color: white;
            display: flex;
            align-items: center;
            padding: 0 35px;
            font-size: 22px;
            font-weight: bold;
        }

        .main {
            height: calc(100vh - 65px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 360px;
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 120, 140, 0.18);
            text-align: center;
        }

        .login-box h1 {
            color: #087f8c;
            margin-bottom: 25px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #b7dfe2;
            border-radius: 8px;
            font-size: 14px;
            text-align: left;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #0a6ed1;
        }

        button {
            width: 96%;
            padding: 13px;
            margin-top: 15px;
            background: linear-gradient(90deg, #0b8f9c, #39a96b);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: linear-gradient(90deg, #087f8c, #2d8f5b);
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .login-logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px auto;
        }

        .register-text {
            margin-top: 15px;
            font-size: 14px;
        }

        .register-text a {
            color: #0b5ed7;
            text-decoration: none;
            font-weight: bold;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="header">
        IT ASSET LIFECYCLE, MAINTENANCE AND MANAGEMENT SYSTEM
    </div>

    <div class="main">

        <div class="login-box">

            <img src="logo.png"
                 class="login-logo"
                 alt="IT Asset Lifecycle Logo">

            <h1>Welcome</h1>

            <div class="subtitle">
                Login to access the Asset Management System
            </div>

            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password">

            <button onclick="login()">
                Login
            </button>

            <p class="register-text">
                Not registered?
                <a href="register.html">Register here</a>
            </p>

            <div id="message"></div>

        </div>

    </div>

<script>

function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (!username || !password) {
        message.style.color = "red";
        message.textContent = "Please enter username and password.";
        return;
    }

    // Existing admin login
    if (username === "admin" && password === "admin123") {
        sessionStorage.setItem("loggedIn", "true");
        sessionStorage.setItem("currentUser", "admin");
        message.style.color = "green";
        message.textContent = "Login successful!";

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 500);
        return;
    }

    // Check registered users
    const users = JSON.parse(localStorage.getItem("assetUsers") || "[]");

    const user = users.find(
        item =>
            item.username.toLowerCase() === username.toLowerCase() &&
            item.password === password
    );

    if (user) {
        sessionStorage.setItem("loggedIn", "true");
        sessionStorage.setItem("currentUser", user.username);

        message.style.color = "green";
        message.textContent = "Login successful!";

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 500);
    } else {
        message.style.color = "red";
        message.textContent = "Invalid username or password.";
    }
}
</script>
