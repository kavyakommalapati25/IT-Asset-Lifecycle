
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Asset Lifecycle Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #d8f3e8, #e8f5e9);
        }

        .login-box {
            background: white;
            width: 380px;
            max-width: 92%;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            color: #087f5b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
        }

        input:focus {
            border-color: #087f5b;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            border: none;
            border-radius: 7px;
            background: #087f5b;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #066b4c;
        }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: 10px;
            color: #087f5b;
            cursor: pointer;
            font-size: 14px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        a {
            color: #087f5b;
            text-decoration: none;
            font-weight: bold;
        }

        #forgotBox {
            display: none;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #ddd;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #087f5b;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>ALHUMA</h2>

        <p class="subtitle">
            IT Asset Lifecycle, Maintenance and Management System
        </p>

        <!-- LOGIN FORM -->
        <div id="loginBox">

            <form onsubmit="login(event)">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <span class="forgot-link" onclick="showForgotPassword()">
                    Forgot Password?
                </span>

                <button type="submit">Login</button>

            </form>

            <div class="register-link">
                Don't have an account?
                <a href="register.html">Register Here</a>
            </div>

        </div>

        <!-- FORGOT PASSWORD FORM -->
        <div id="forgotBox">

            <h3 style="text-align:center; color:#087f5b;">
                Reset Password
            </h3>

            <form onsubmit="resetPassword(event)">

                <label for="resetUsername">Username</label>
                <input
                    type="text"
                    id="resetUsername"
                    placeholder="Enter your username"
                    required
                >

                <label for="newPassword">New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >

                <button type="submit">Reset Password</button>

            </form>

            <span class="back-link" onclick="hideForgotPassword()">
                ← Back to Login
            </span>

        </div>

        <div id="message" role="status"></div>

    </div>

    <script>
        // LOGIN FUNCTION
        function login(event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const message = document.getElementById("message");

            // Admin login
            if (username === "admin" && password === "admin123") {
                message.style.color = "green";
                message.textContent = "Admin login successful!";

                // Change dashboard.html to your actual dashboard filename.
                setTimeout(function () {
                    window.location.href = "dashboard.html";
                }, 700);

                return;
            }

            // Registered user login
            const users = JSON.parse(
                localStorage.getItem("assetUsers") || "[]"
            );

            const user = users.find(function (item) {
                return item.username === username &&
                       item.password === password;
            });

            if (user) {
                message.style.color = "green";
                message.textContent = "Login successful!";

                // Change dashboard.html to your actual dashboard filename.
                setTimeout(function () {
                    window.location.href = "dashboard.html";
                }, 700);
            } else {
                message.style.color = "red";
                message.textContent =
                    "Invalid username or password!";
            }
        }

        // SHOW FORGOT PASSWORD FORM
        function showForgotPassword() {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("forgotBox").style.display = "block";
            document.getElementById("message").textContent = "";
        }

        // BACK TO LOGIN
        function hideForgotPassword() {
            document.getElementById("forgotBox").style.display = "none";
            document.getElementById("loginBox").style.display = "block";
            document.getElementById("message").textContent = "";

            document.getElementById("resetUsername").value = "";
            document.getElementById("newPassword").value = "";
            document.getElementById("confirmPassword").value = "";
        }

        // RESET PASSWORD
        function resetPassword(event) {
            event.preventDefault();

            const username =
                document.getElementById("resetUsername").value.trim();

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message = document.getElementById("message");

            if (username === "admin") {
                message.style.color = "red";
                message.textContent =
                    "Admin password cannot be reset here.";
                return;
            }

            if (newPassword.length < 6) {
                message.style.color = "red";
                message.textContent =
                    "Password must contain at least 6 characters.";
                return;
            }

            if (newPassword !== confirmPassword) {
                message.style.color = "red";
                message.textContent =
                    "Passwords do not match!";
                return;
            }

            const users = JSON.parse(
                localStorage.getItem("assetUsers") || "[]"
            );

            const userIndex = users.findIndex(function (item) {
                return item.username === username;
            });

            if (userIndex === -1) {
                message.style.color = "red";
                message.textContent =
                    "Username not found. Please check your username.";
                return;
            }

            users[userIndex].password = newPassword;

            localStorage.setItem(
                "assetUsers",
                JSON.stringify(users)
            );

            message.style.color = "green";
            message.textContent =
                "Password reset successful! Please log in.";

            document.getElementById("forgotBox").style.display = "none";
            document.getElementById("loginBox").style.display = "block";

            document.getElementById("username").value = username;
            document.getElementById("password").value = "";
        }
    </script>

</body>
</html>
